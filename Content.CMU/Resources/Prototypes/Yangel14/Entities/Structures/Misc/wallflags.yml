- type: entity
  parent: BaseSign
  id: Yangel14WallFlagBase
  abstract: true
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallTops
    sprite: Yangel14/Structures/wallflags.rsi
    snapCardinals: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0
        
  - type: entity
  parent: Yangel14WallFlagBase
  id: Yangel14WallFlagUEG
  name: "UEG Flag"
  description: "The flag of the United Earth Government."
  components:
  - type: Sprite
    state: uegflag

- type: entity
  parent: Yangel14WallFlagBase
  id: Yangel14WallFlagUEGWorn
  name: "Worn UEG Flag"
  description: "The flag of the United Erth Government. This one has seen better days."
  components:
  - type: Sprite
    state: uegflag_worn

